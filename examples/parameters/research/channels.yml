params:
  startDepth: 0cm
  endDepth: "{probe::defaults::depth}"
  speedOfSound: 1540 m/s
  txFocus: "{endDepth} / 2"
  txFreq: "{probe::stackinfo::centerFreq}"
  txPulse: +-
  txApt: "{probe::capabilities::tx}"
  txFn: 1
  rxFn: 1
  rfDecimation: "max(1, ceil({endDepth} / 4cm))"
  lpfid: 0
  steer: 0 degrees
  element: "{probe::geometry::elements} / 2"
  # none: channels as received; dynamic: each channel pre-delayed for the centre beam
  focusType: none
  alt: "{probe::capabilities::platform} != v1"
  singleElement: false
  # 24 adjacent scan lines from scanStart (centred by default): focused transmit on each, its 32 channels received one per event
  scan: false
  scanStart: "{probe::geometry::elements} / 2 - 12"
  viewSingleElement: false
  rampGain: false
  storeRaw: false

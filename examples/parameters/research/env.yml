params:
  startDepth: 0cm
  endDepth: "{probe::defaults::depth}"
  speedOfSound: 1540 m/s
  txFreq: "{probe::stackinfo::centerFreq}"
  txPulse: +-
  txPulseInv: -+
  txFocus: "{endDepth} / 2"
  steer: 0 degrees
  iqDecimation: "{endDepth} > 10cm ? 8 : 4"
  envDecimation: "{iqDecimation} + 2"
  lpfid: "{probe::stackinfo::centerFreq} < 7 MHz ? 17 : 0"
  dr: 50dB
  nf: 10dB
  storeRaw: false

  # sequencing parameters
  rxc: 32
  mla: 1
  pih: false
  overlap: "{mla} == 1 ? 0 : {mla} / 2"
  pihEnabled: "{pih} || ({ceMode} && {ceType} == pih)"

  # mla offsets for low level sequences
  txoffseta : 1.5
  txoffsetb : 3.5
  rxoffset1a : -1.5
  rxoffset2a : -0.5
  rxoffset3a : 0.5
  rxoffset4a : 1.5
  rxoffset1b : 0.5
  rxoffset2b : 1.5
  rxoffset3b : -1.5
  rxoffset4b : -0.5

  # mode flags
  scMode: false
  mMode: false
  pwMode: false
  ceMode: false
  ceType: pih
  ceAmMode: "{ceMode} && {ceType} == am"
  rfMode: false
  cfiMode: false

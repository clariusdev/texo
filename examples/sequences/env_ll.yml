# transmit nodes
tx:
 b:
  shape: "{txPulse}"
  focus: "{txFocus}"
  freq: "{probe::stackinfo::centerFreq}"
  fnumber: 1
  channels: all
  maxApt: "{probe::capabilities::tx}"

# receive nodes
rx:
 b:
  shallow: "{probe::freq::upperFreq}"
  deep: "{probe::freq::lowFreq}"
  depth: "{probe::freq::end depth}"
  fnumber: 1
  channels: all
  type: dynamic
  apod: b
  dtgc: b
 rx25:
  shallow: "{probe::freq::upperFreq}"
  deep: "{probe::freq::lowFreq}"
  depth: "{probe::freq::end depth}"
  fnumber: 1
  channels: all
  type: dynamic
  apod: b
  dtgc: d25
 rx75:
  shallow: "{probe::freq::upperFreq}"
  deep: "{probe::freq::lowFreq}"
  depth: "{probe::freq::end depth}"
  fnumber: 1
  channels: all
  type: dynamic
  apod: b
  dtgc: d75

seq:
 # sla sequence
 sla:
  start: "{startDepth}"
  end: "{endDepth}"
  targetLineDuration: 0 microseconds
  events:
      - { el: "0", txAngle: "{steer}", rxAngle: "{steer}", lpf: "{lpfid}", tx: b, rx: [ { rx: b } ], tgc: b }
